# BMSVR config (place next to bms.exe or as VR\bmsvr.cfg)
vr_scale 39.37
snap_turn 0
snap_angle 45
turn_speed 0.35
left_handed 0
roomscale 1
hud_distance 1.3
msaa 0

# Stereo from one mono frame (horizontal StretchRect crop). Never enables 2x RenderView.
# 0 = full mono frame to both eyes (diagnose capture / prefer while fixing black HMD).
stereo_copy 0
# 0 = auto from OpenXR IPD/FOV; >0 = fixed pixel crop
stereo_offset 0
stereo_converge 1.5

# Relative HMD look into CreateMove (absolute angles crash BM). soft_pitch default off.
soft_pitch 0
move_deadzone 0.15
turn_deadzone 0.20
# 0 = eye RTs at window/backbuffer size (stable); 1 = OpenXR recommended size
# Note: capture still StretchRects from the window-sized frame color RT — HMD-sized
# RTs only upsample; true sharpness needs a higher-res game render path (not 2x RenderView).
eye_use_hmd_res 0

# Capture source for PrePresent / unbind copy (MR mirror / HMD).
# auto = latch oversized FullFrameFB on SetRenderTarget unbind, else probe
#   rt0-vp then rt0-bl (never auto bb — stub StretchRect is pure black S_OK).
# Force: rt0_vp | rt0_bl | rt0_tl | rt0_ctr | rt0 | bb (bb only if resolved)
capture_src auto

# Relative viewmodel pose via CalcViewModelView input adjust (local copies before original).
# eyePos/eyeAng are INPUTS (Source const refs) — post-return tweaks do nothing; do not mutate caller.
# Default off. When on: viewmodel_follow places eyePos by (controller-HMD) tracking delta;
# if controller pose missing, falls back to constant eyeAngles-basis offsets.
# viewmodel_aim 0 = leave angles alone (safe); 1 = controller aim angles for viewmodel only
# (never fed into CreateMove/viewangles). Fine-tune: off_f/r/u in hammer units.
# Feel: off_f≈2 is a slight forward nudge; larger off_r/u shift gun in view. Start small.
viewmodel_vr 0
viewmodel_follow 1
viewmodel_aim 0
viewmodel_off_f 2
viewmodel_off_r 0
viewmodel_off_u 0
