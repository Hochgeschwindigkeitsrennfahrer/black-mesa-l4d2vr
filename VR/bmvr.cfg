// Black Mesa VR — exec'd from autoexec.cfg. Do not ClientCmd these from Present.
// Crosshair only was previous policy. ICvar SetConVarInt is currently a no-op
// (FindVar probe disabled after 2026-08-18 hang), so VR QoL logged "0 ok".
// Put engine cvars here so they actually apply. Flashlight cvars still must
// NOT be added — they broke deferred __GBLightSpot_FlashLight after fused-6DoF.
crosshair 0
hud_crosshair_enable 0

// HMD-fb stereo blits the shared backbuffer. mat_queue_mode 2 made both
// eyes the same image and ~180fps flicker (2026-08-26). Stay single-thread.
mat_queue_mode 0

// Restore PVS / HW occlusion. The old stereo workaround (r_occlusion 0 +
// r_portalsopenall 1) drew every leaf and made open/complex maps unplayable.
// If an eye shows skybox-only until you walk, set ForceOpenVis=true in
// VR\config.txt and the next launch puts these four back.
r_occlusion 1
r_fastzreject 1
r_visocclusion 1
r_portalsopenall 0

// BM new-renderer CSM: stereo logged _rt_gbshadowmaprt 8192x8192 per eye.
// Quality 0 still built cascades. ICvar turns CSM off (not Present ClientCmd).
cl_csm_enabled 0
nr_shadow_active 0
cl_csm_qualitymode 0
nr_shadow_quality 0
nr_shadow_filter_quality 0
nr_shadow_max_passes_per_frame 1
nr_shadow_res 1024
nr_lights_quality 0
r_shadowrendertotexture 0
r_shadowlod 2
r_shadows 0

// Stereo fillrate: LOD, no 3D sky, no grass sprites, no dlights.
// Xen (bm_c4*) also sets r_lod 3 from the DLL after LevelInit.
r_lod 2
r_rootlod 2
r_dynamic 0
r_dynamiclighting 0
r_maxdlights 0
r_3dsky 0
r_drawdetailprops 0
cl_detaildist 0
cl_detailfade 0

// P0c: planar water/gbuffer reflections — overnight code path never applied
// these via ICvar. Still present in log as PushRT _rt_waterreflection.
// If ghosts remain after this cfg lands, the source is NOT only planar water.
r_WaterDrawReflection 0
r_waterforcereflectentities 0
r_waterforceexpensive 0
nr_gbuffer_for_reflection_enabled 0
r_WaterDrawRefraction 0
