// Black Mesa VR — exec'd from autoexec.cfg. Do not ClientCmd these from Present.
// ICvar SetConVarInt from the first RenderView also writes them (xor'd int at
// +0x30). Client.dll cvars may not exist yet at autoexec, so both paths matter.
// Flashlight cvars still must NOT be added — they broke deferred
// __GBLightSpot_FlashLight after fused-6DoF. Never nr_lights_active 0.
crosshair 0
hud_crosshair_enable 0

// HMD-fb stereo blits the shared backbuffer. mat_queue_mode 2 made both
// eyes the same image and ~180fps flicker (2026-08-26). Stay single-thread.
mat_queue_mode 0

// Restore PVS / HW occlusion. The old stereo workaround (r_occlusion 0 +
// r_portalsopenall 1) drew every leaf and made open/complex maps unplayable.
// If an eye shows skybox-only until you walk, set ForceOpenVis=true in
// VR\config.txt and the next launch puts these four back.
r_occlusion 1
r_fastzreject 1
r_visocclusion 1
r_portalsopenall 0

// BM new-renderer CSM: stereo logged _rt_gbshadowmaprt 8192x8192 per eye.
// Lowest quality + 2048 res + one shadow pass. This is the last set that
// felt "a bit better" on Surface Tension. Do NOT put back: cl_csm_enabled 0,
// nr_shadow_active 0, nr_dev_gb_debug_type 1, r_lod 2 — verified unplayable
// in the first-soldier fight (gbDepth stayed 4; combat ~27fps + 62ms hitch).
cl_csm_enabled 1
cl_csm_qualitymode 0
cl_csm_cascade_dynamic_ignore 0
nr_shadow_active 1
nr_shadow_quality 0
nr_shadow_filter_quality 0
nr_shadow_max_passes_per_frame 1
nr_shadow_res 2048
nr_lights_quality 0
nr_lights_procedural_disable_all_lights 0
nr_dev_shoot_lights_enabled 1
nr_dev_gb_debug_type 2
gb_flashlight_shadow_enabled 1
cl_dlight_manager_enable 1
r_dynamic 1
r_maxdlights 32
r_lod -1
r_rootlod 0
r_eyes 1
r_teeth 1
flex_smooth 1
r_drawflecks 1
mat_reduceparticles 0
cl_new_impact_effects 1
nr_allow_hammer_nerfs 0
nr_allow_hammer_nerfs_4ways 0
nr_gbuffer_for_refraction_enabled 1
r_shadowrendertotexture 0
r_shadowlod 2

// P0c: planar water/gbuffer reflections — overnight code path never applied
// these via ICvar. Still present in log as PushRT _rt_waterreflection.
// If ghosts remain after this cfg lands, the source is NOT only planar water.
r_WaterDrawReflection 0
r_waterforcereflectentities 0
r_waterforceexpensive 0
nr_gbuffer_for_reflection_enabled 0
